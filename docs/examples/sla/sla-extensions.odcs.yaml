# Demonstrates RFC-0046: customProperties and authoritativeDefinitions on
# individual slaProperties entries.

version: 1.0.0
apiVersion: v3.2.0
kind: DataContract
id: 7f2a9c4d-1b6e-4a8d-9c0f-3e4a5b6c7d8e
status: active
name: my_table
schema: []
slaProperties:
  - property: availability
    value: 99.9
    unit: "%"
    customProperties:
      - property: alertPolicyId
        value: pol-123
  - property: latency
    value: 100
    unit: ms
    authoritativeDefinitions:
      - url: https://wiki.acme.com/sla/latency
        type: businessDefinition
    customProperties:
      - property: alertPolicyId
        value: pol-123
      - property: owner
        value: data-platform-team
