# Demonstrates RFC-0057: the `teradata` server type for Teradata Vantage, an
# enterprise data warehouse. In Teradata the database is the namespace, so there
# is no `schema` field.

version: 1.0.0
apiVersion: v3.2.0
kind: DataContract
id: 3b7d1c58-2f94-4a06-8e1b-9c5a0d4f7e23
status: active
servers:
  - server: prod
    type: teradata
    host: teradata.acme.com
    port: 1025
    database: SALES
schema:
  - name: sales
    physicalType: table
    properties:
      - name: sale_id
        logicalType: string
        required: true
