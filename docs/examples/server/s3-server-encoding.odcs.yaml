# Demonstrates RFC-0043: the optional `encoding` field on server definitions.
# The same logical schema is exposed through two S3 servers with different
# physical character encodings.

version: 1.0.0
apiVersion: v3.2.0
kind: DataContract
id: 7b3f0c2e-1d4a-4e6b-9f2a-0a1b2c3d4e5f
status: active
servers:
  - server: modern
    type: s3
    location: s3://modern-bucket/customers/*.csv
    format: csv
    encoding: UTF-8
  - server: legacy
    type: s3
    location: s3://legacy-bucket/customers/*.csv
    format: csv
    encoding: ISO-8859-1
schema:
  - name: customers
    physicalType: table
    properties:
      - name: customer_id
        logicalType: string
        required: true
      - name: customer_name
        logicalType: string
