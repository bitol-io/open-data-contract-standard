# Demonstrates key/value tags: each `tags` entry is either a string or a
# single key/value pair with a string, number, or boolean value.

version: 1.0.0
apiVersion: v3.2.0
kind: DataContract
id: 9c4f7e21-3b8a-4d5e-a1f6-2e7b9c0d4a85
status: active
tags:
  - finance
  - domain: sales
schema:
